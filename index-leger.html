<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Assistant Otaku – Bryan Sabin | Questions sur les mangas et animes</title>
  <meta name="description" content="Assistant Otaku par Bryan Sabin : pose tes questions sur les mangas et animes, anciens et récents. Histoires, personnages, ordre de lecture, recommandations, sans spoiler.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05080c">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Assistant Otaku – Bryan Sabin">
  <meta property="og:description" content="Pose toutes tes questions sur les mangas et animes, anciens et récents.">
  <style>
    * { box-sizing: border-box; }
    html { background: #05080c; }
    html, body { height: 100%; margin: 0; color: #eef3f8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }

    /* Vidéo en fond d'écran */
    #fond { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; filter: brightness(1.6) contrast(1.05); }
    .voile { position: fixed; inset: 0; z-index: -1; background: linear-gradient(#05080c66, #05080c1a 45%, #05080c99); }

    header { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px; }
    header h1 { margin: 0; font-size: 1.15rem; }
    header p { margin: 2px 0 0; color: #a9bccb; font-size: 0.85rem; }
    #son { flex: none; border: 1px solid #ffffff44; background: #05080c99; color: #fff;
      border-radius: 999px; padding: 8px 14px; font-size: 0.9rem; }

    #chat { flex: 1; overflow-y: auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; line-height: 1.45;
      white-space: pre-wrap; word-wrap: break-word; backdrop-filter: blur(6px); }
    .bot { background: #0d1822d9; border: 1px solid #ffffff1f; align-self: flex-start; border-bottom-left-radius: 6px; }
    .moi { background: #3a6df0; color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
    .erreur { color: #ff8a8a; }

    #idees { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 10px; }
    #idees button { background: #0d1822d9; color: #eef3f8; border: 1px solid #ffffff2e;
      border-radius: 999px; padding: 8px 14px; font-size: 0.9rem; }

    .note { text-shadow: 0 1px 4px #000; text-align: center; color: #8fa3b3; font-size: 0.72rem; padding: 0 12px 6px; }
    form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: #05080ccc; }
    textarea { flex: 1; resize: none; border: 1px solid #ffffff2e; border-radius: 20px; padding: 10px 14px;
      font: inherit; background: #0d1822; color: #eef3f8; max-height: 120px; }
    #envoyer { border: 0; background: #3a6df0; color: #fff; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; }
    #envoyer:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <video id="fond" src="fond.mp4" autoplay muted loop playsinline preload="auto"></video>
  <div class="voile"></div>

  <header>
    <div>
      <h1>💀 Assistant Otaku</h1>
      <p>par Bryan Sabin · mangas et animes</p>
    </div>
    <button id="son" type="button">🔇 Activer le son</button>
  </header>

  <div id="chat"></div>
  <div id="idees"></div>

  <div class="note">L'IA peut se tromper, surtout sur les sorties très récentes. Vidéo : @mrkhan123khn (TikTok)</div>
  <form id="formulaire">
    <textarea id="saisie" rows="1" placeholder="Pose ta question sur un manga ou un anime…" enterkeyhint="send"></textarea>
    <button id="envoyer" type="submit" aria-label="Envoyer">➤</button>
  </form>

  <script>
    var chat = document.getElementById("chat");
    var saisie = document.getElementById("saisie");
    var bouton = document.getElementById("envoyer");
    var idees = document.getElementById("idees");
    var video = document.getElementById("fond");
    var son = document.getElementById("son");
    var historique = [];   // la conversation, renvoyée au serveur à chaque message
    var occupe = false;

    var SUGGESTIONS = [
      "Recommande-moi un manga sombre et profond",
      "Explique la fin de Death Note sans spoiler",
      "Dans quel ordre regarder Naruto ?",
      "Quels sont les meilleurs mangas du moment ?"
    ];

    // Le navigateur interdit le son automatique : on l'active avec ce bouton
    son.addEventListener("click", function () {
      video.muted = !video.muted;
      if (video.paused) video.play();
      son.textContent = video.muted ? "🔇 Activer le son" : "🔊 Son activé";
    });

    function ajouter(texte, classe) {
      var d = document.createElement("div");
      d.className = "msg " + classe;
      d.textContent = texte;            // textContent = sécurisé (aucun HTML injecté)
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    async function envoyer(texte) {
      texte = (texte || "").trim();
      if (!texte || occupe) return;
      occupe = true; bouton.disabled = true; idees.style.display = "none";

      ajouter(texte, "moi");
      historique.push({ role: "user", content: texte });
      saisie.value = ""; saisie.style.height = "auto";
      var attente = ajouter("…", "bot");

      try {
        var r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: historique })
        });
        var data = await r.json();
        if (!r.ok || !data.reply) throw new Error(data.error || "Erreur inconnue");
        attente.textContent = data.reply;
        historique.push({ role: "assistant", content: data.reply });
      } catch (e) {
        attente.textContent = "Désolé, ça n'a pas marché : " + e.message;
        attente.classList.add("erreur");
        historique.pop();   // on retire la question pour pouvoir réessayer
      }
      occupe = false; bouton.disabled = false; saisie.focus();
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("formulaire").addEventListener("submit", function (e) {
      e.preventDefault(); envoyer(saisie.value);
    });
    saisie.addEventListener("input", function () {
      saisie.style.height = "auto"; saisie.style.height = Math.min(saisie.scrollHeight, 120) + "px";
    });

    SUGGESTIONS.forEach(function (s) {
      var b = document.createElement("button");
      b.textContent = s; b.type = "button";
      b.onclick = function () { envoyer(s); };
      idees.appendChild(b);
    });
    ajouter("Yo, otaku ! 💀 Je connais les mangas et animes, anciens comme récents. Pose-moi ta question : histoire, personnages, fin, ordre de lecture, recommandations… Je préviens avant chaque spoiler.", "bot");
  </script>
</body>
</html>
