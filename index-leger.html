<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Assistant Otaku – Bryan Sabin | Questions sur les mangas et animes</title>
  <meta name="description" content="Assistant Otaku par Bryan Sabin : pose tes questions sur les mangas et animes, anciens et récents. Histoires, personnages, ordre de lecture, recommandations, sans spoiler.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05080c">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Assistant Otaku – Bryan Sabin">
  <meta property="og:description" content="Pose toutes tes questions sur les mangas et animes, anciens et récents.">
  <style>
    * { box-sizing: border-box; }
    html { background: #05080c; }
    html, body { height: 100%; margin: 0; color: #eef3f8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }

    /* Vidéo en fond d'écran du site */
    #fond { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; filter: brightness(1.05); }
    .voile { position: fixed; inset: 0; z-index: -1; background: linear-gradient(#05080c66, #05080c1a 45%, #05080c99); }

    header { display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px; }
    header h1 { margin: 0; font-size: 1.15rem; }
    header p { margin: 2px 0 0; color: #a9bccb; font-size: 0.85rem; }
    .boutons { display: flex; gap: 6px; flex: none; }
    .petit { border: 1px solid #ffffff44; background: #05080c99; color: #fff; border-radius: 999px; padding: 8px 12px; font-size: 0.85rem; }

    #chat { flex: 1; overflow-y: auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; line-height: 1.45;
      white-space: pre-wrap; word-wrap: break-word; backdrop-filter: blur(6px); }
    .bot { background: #0d1822d9; border: 1px solid #ffffff1f; align-self: flex-start; border-bottom-left-radius: 6px; }
    .moi { background: #3a6df0; color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
    .erreur { color: #ff8a8a; }

    #idees { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 10px; }
    #idees button { background: #0d1822d9; color: #eef3f8; border: 1px solid #ffffff2e;
      border-radius: 999px; padding: 8px 14px; font-size: 0.9rem; }

    .note { text-shadow: 0 1px 4px #000; text-align: center; color: #b3c4d2; font-size: 0.72rem; padding: 0 12px 6px; }
    form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: #05080ccc; }
    textarea { flex: 1; resize: none; border: 1px solid #ffffff2e; border-radius: 20px; padding: 10px 14px;
      font: inherit; background: #0d1822; color: #eef3f8; max-height: 120px; }
    #envoyer { border: 0; background: #3a6df0; color: #fff; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; }
    #envoyer:disabled { opacity: 0.5; }

    /* ===== PRÉSENTATION : s'affiche à l'ouverture du site, par-dessus la vidéo ===== */
    #presentation { position: fixed; inset: 0; z-index: 10; transition: opacity 0.8s ease;
      background: linear-gradient(#05080c99, #05080c33 45%, #05080cb3); }
    #presentation.fin { opacity: 0; pointer-events: none; }
    #presentation.cache { display: none; }
    #scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 12px; padding: 24px; text-shadow: 0 2px 12px #000; }
    #scene .gros { font-size: 4.5rem; }
    #scene h2 { margin: 0; font-size: 2rem; color: #9fd8ff; text-transform: uppercase; letter-spacing: 1px; }
    #scene p { margin: 0; font-size: 1.2rem; max-width: 420px; }
    #scene.anim { animation: apparait 0.8s ease; }
    @keyframes apparait { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    #barre { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: #7fd1ff; z-index: 3; }
    #passer { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 2; display: none; }
    #depart { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; background: #05080ccc; text-align: center; padding: 24px; z-index: 2; }
    #depart h2 { margin: 0; font-size: 2.2rem; }
    #depart p { margin: 0; color: #a9bccb; }
    .principal { border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 700; font-size: 1.05rem; background: #7fd1ff; color: #05212f; }
  </style>
</head>
<body>
  <!-- La vidéo essaie les fichiers dans l'ordre : le premier qui marche est utilisé -->
  <video id="fond" autoplay muted loop playsinline preload="auto">
    <source src="fond-2.mp4" type="video/mp4">
    <source src="fond-1.mp4" type="video/mp4">
    <source src="fond.mp4" type="video/mp4">
  </video>
  <div class="voile"></div>

  <header>
    <div>
      <h1>💀 Assistant Otaku</h1>
      <p>par Bryan Sabin · mangas et animes</p>
    </div>
    <div class="boutons">
      <button id="revoir" class="petit" type="button">▶ Intro</button>
      <button id="son" class="petit" type="button">🔇 Son</button>
    </div>
  </header>

  <div id="chat"></div>
  <div id="idees"></div>

  <div class="note">L'IA peut se tromper, surtout sur les sorties très récentes. Vidéo : montage anime fourni par Bryan Sabin</div>
  <form id="formulaire">
    <textarea id="saisie" rows="1" placeholder="Pose ta question sur un manga ou un anime…" enterkeyhint="send"></textarea>
    <button id="envoyer" type="submit" aria-label="Envoyer">➤</button>
  </form>

  <!-- PRÉSENTATION -->
  <div id="presentation">
    <div id="barre"></div>
    <div id="scene"></div>
    <button id="passer" class="petit" type="button">Passer ›</button>
    <div id="depart">
      <h2>💀 Bryan Sabin</h2>
      <p>Assistant Otaku. Mets le son : la présentation dure 1 minute.</p>
      <button id="lancer" class="principal" type="button">▶ Lancer la présentation</button>
      <button id="sauter" class="petit" type="button">Aller directement au site</button>
    </div>
  </div>

  <script>
    /* ---------- PRÉSENTATION synchronisée avec la musique (temps en secondes) ---------- */
    var SCENES = [
      { de: 0,  emoji: "💀", titre: "Bienvenue",            texte: "Voici l'Assistant Otaku." },
      { de: 9,  emoji: "👤", titre: "Le créateur",          texte: "Créé par Bryan Sabin." },
      { de: 14, emoji: "💬", titre: "Il discute",           texte: "Pose-lui toutes tes questions sur les mangas et les animes." },
      { de: 20, emoji: "📚", titre: "Anciens et récents",   texte: "Histoires, personnages, fins, ordre de lecture, recommandations." },
      { de: 25, emoji: "🛡️", titre: "Sans spoiler",         texte: "Il te prévient avant chaque spoiler." },
      { de: 31, emoji: "⚡", titre: "Gratuit",              texte: "Sans inscription, directement sur ton téléphone." },
      { de: 40, emoji: "⚠️", titre: "Une précision",        texte: "L'IA peut se tromper sur les sorties très récentes." },
      { de: 44, emoji: "🔥", titre: "À toi de jouer",       texte: "Pose ta première question !" }
    ];
    var DUREE = 63;

    var pres = document.getElementById("presentation");
    var video = document.getElementById("fond");
    var zone = document.getElementById("scene");
    var barre = document.getElementById("barre");
    var depart = document.getElementById("depart");
    var passer = document.getElementById("passer");
    var son = document.getElementById("son");
    var courante = -1, enPresentation = false, sansVideo = false, horlogeId = null;

    function afficher(i) {
      if (i === courante) return;
      courante = i;
      var s = SCENES[i];
      zone.innerHTML = '<div class="gros">' + s.emoji + '</div><h2>' + s.titre + '</h2><p>' + s.texte + '</p>';
      zone.classList.remove("anim"); void zone.offsetWidth; zone.classList.add("anim");
    }
    function maj(t, duree) {
      var i = 0;
      for (var k = 0; k < SCENES.length; k++) if (t >= SCENES[k].de) i = k;
      afficher(i);
      barre.style.width = Math.min(100, t / duree * 100) + "%";
    }
    video.addEventListener("timeupdate", function () {
      if (enPresentation && !sansVideo) maj(video.currentTime, video.duration || DUREE);
    });

    // Si aucune vidéo ne se charge, la présentation continue avec une horloge
    function horloge() {
      sansVideo = true; video.style.display = "none";
      var debut = Date.now(); clearInterval(horlogeId);
      horlogeId = setInterval(function () {
        var t = (Date.now() - debut) / 1000;
        maj(t, DUREE);
        if (t >= DUREE) fermer();
      }, 250);
    }
    var sources = video.querySelectorAll("source");
    sources[sources.length - 1].addEventListener("error", function () { sansVideo = true; video.style.display = "none"; });

    function majSon() { son.textContent = video.muted ? "🔇 Son" : "🔊 Son"; }

    function fermer() {
      enPresentation = false; clearInterval(horlogeId);
      pres.classList.add("fin");
      setTimeout(function () { pres.classList.add("cache"); }, 800);
      // après la présentation, la vidéo reste en fond d'écran, en boucle
      video.loop = true; video.muted = true; majSon();
      var p = video.play(); if (p && p.catch) p.catch(function () {});
    }
    function lancer() {
      enPresentation = true; courante = -1;
      pres.classList.remove("fin", "cache");
      depart.style.display = "none"; passer.style.display = "block";
      maj(0, DUREE);
      video.loop = false; video.muted = false; majSon();
      if (sansVideo) { horloge(); return; }
      video.currentTime = 0;
      var p = video.play(); if (p && p.catch) p.catch(horloge);
    }
    video.addEventListener("ended", function () { if (enPresentation) fermer(); });
    passer.addEventListener("click", fermer);
    document.getElementById("sauter").addEventListener("click", function () { depart.style.display = "none"; fermer(); });
    document.getElementById("lancer").addEventListener("click", lancer);
    document.getElementById("revoir").addEventListener("click", lancer);
    son.addEventListener("click", function () {
      video.muted = !video.muted; majSon();
      if (video.paused) video.play();
    });

    /* ---------- CHAT ---------- */
    var chat = document.getElementById("chat");
    var saisie = document.getElementById("saisie");
    var bouton = document.getElementById("envoyer");
    var idees = document.getElementById("idees");
    var historique = [];
    var occupe = false;

    var SUGGESTIONS = [
      "Recommande-moi un manga sombre et profond",
      "Explique la fin de Death Note sans spoiler",
      "Dans quel ordre regarder Naruto ?",
      "Quels sont les meilleurs mangas du moment ?"
    ];

    function ajouter(texte, classe) {
      var d = document.createElement("div");
      d.className = "msg " + classe;
      d.textContent = texte;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    async function envoyer(texte) {
      texte = (texte || "").trim();
      if (!texte || occupe) return;
      occupe = true; bouton.disabled = true; idees.style.display = "none";
      ajouter(texte, "moi");
      historique.push({ role: "user", content: texte });
      saisie.value = ""; saisie.style.height = "auto";
      var attente = ajouter("…", "bot");
      try {
        var r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: historique })
        });
        var data = await r.json();
        if (!r.ok || !data.reply) throw new Error(data.error || "Erreur inconnue");
        attente.textContent = data.reply;
        historique.push({ role: "assistant", content: data.reply });
      } catch (e) {
        attente.textContent = "Désolé, ça n'a pas marché : " + e.message;
        attente.classList.add("erreur");
        historique.pop();
      }
      occupe = false; bouton.disabled = false; saisie.focus();
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("formulaire").addEventListener("submit", function (e) { e.preventDefault(); envoyer(saisie.value); });
    saisie.addEventListener("input", function () {
      saisie.style.height = "auto"; saisie.style.height = Math.min(saisie.scrollHeight, 120) + "px";
    });
    SUGGESTIONS.forEach(function (s) {
      var b = document.createElement("button");
      b.textContent = s; b.type = "button";
      b.onclick = function () { envoyer(s); };
      idees.appendChild(b);
    });
    ajouter("Yo, otaku ! 💀 Je connais les mangas et animes, anciens comme récents. Pose-moi ta question : histoire, personnages, fin, ordre de lecture, recommandations… Je préviens avant chaque spoiler.", "bot");
  </script>
</body>
</html>
